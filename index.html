<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Тайминг 29–30 мая · редактор</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .drag-handle { cursor: grab; }
  .drag-handle:active { cursor: grabbing; }
  .ghost { opacity: 0.4; background: #fef9c3; }
  .row-input { background: transparent; outline: none; border: none; width: 100%; padding: 4px 6px; border-radius: 4px; }
  .row-input:hover { background: rgba(0,0,0,0.04); }
  .row-input:focus { background: rgba(255,255,255,0.95); box-shadow: 0 0 0 2px #3b82f6; }
  .col-time   { width: 70px; text-align: center; font-variant-numeric: tabular-nums; }
  .col-dur    { width: 70px; text-align: center; }
  .col-num    { width: 36px; text-align: center; color: #94a3b8; font-size: 0.75rem; }
  select.row-input { padding-right: 22px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, #64748b 50%), linear-gradient(135deg, #64748b 50%, transparent 50%); background-position: calc(100% - 12px) 50%, calc(100% - 7px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  @media print {
    .no-print { display: none !important; }
    .row > * { background: transparent !important; }
  }
</style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900">

<header class="bg-white border-b sticky top-0 z-10 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-2 flex-wrap">
    <div>
      <h1 class="text-xl font-bold">Тайминг 29–30 мая</h1>
      <p class="text-xs text-slate-500">Автосохранение в браузере · перетаскивай за <span class="font-bold">≡</span> · клик по любому полю — редактирование</p>
    </div>
    <div class="flex items-center gap-2 text-sm flex-wrap no-print">
      <button onclick="resetToDefault()" class="px-3 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300">↩ Сбросить</button>
      <button onclick="exportJSON()" class="px-3 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300">⬇ JSON</button>
      <label class="px-3 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300 cursor-pointer">
        ⬆ Загрузить JSON
        <input type="file" accept="application/json" onchange="importJSON(event)" class="hidden" />
      </label>
      <button onclick="copyMarkdown()" class="px-3 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300">📋 Markdown</button>
      <button onclick="window.print()" class="px-3 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300">🖨 Печать</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-4 grid lg:grid-cols-2 gap-5">
  <section id="day-29" class="bg-white rounded-xl shadow border"></section>
  <section id="day-30" class="bg-white rounded-xl shadow border"></section>
</main>

<footer class="max-w-7xl mx-auto px-4 py-6 text-xs text-slate-500 no-print">
  Все изменения сохраняются автоматически в этом браузере. Чтобы перенести на другое устройство — экспортируй JSON.
</footer>

<!-- Toast -->
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-lg shadow-lg opacity-0 transition-opacity pointer-events-none text-sm"></div>

<script>
// ────────────────────────────────────────────────────────────────────────
// Конфигурация: типы блоков и их цвета
// ────────────────────────────────────────────────────────────────────────
const TYPES = {
  "Брифинг":    { bg: "bg-blue-100",    border: "border-blue-300",   text: "text-blue-900",    chip: "bg-blue-200 text-blue-900" },
  "Контент":    { bg: "bg-white",       border: "border-slate-200",  text: "text-slate-900",   chip: "bg-slate-200 text-slate-700" },
  "Признание":  { bg: "bg-amber-100",   border: "border-amber-300",  text: "text-amber-900",   chip: "bg-amber-200 text-amber-900" },
  "Кофе-брейк": { bg: "bg-orange-100",  border: "border-orange-300", text: "text-orange-900",  chip: "bg-orange-200 text-orange-900" },
  "Обед":       { bg: "bg-rose-100",    border: "border-rose-300",   text: "text-rose-900",    chip: "bg-rose-200 text-rose-900" },
  "Буфер":      { bg: "bg-slate-100",   border: "border-slate-300",  text: "text-slate-600",   chip: "bg-slate-300 text-slate-700" },
  "Закрытие":   { bg: "bg-emerald-100", border: "border-emerald-300",text: "text-emerald-900", chip: "bg-emerald-200 text-emerald-900" },
};

// ────────────────────────────────────────────────────────────────────────
// Начальные данные (восстанавливаются кнопкой ↩ Сбросить)
// ────────────────────────────────────────────────────────────────────────
const DEFAULT_DATA = {
  day29: {
    title: "29 мая (четверг) · 10:00–18:00",
    start: "10:00",
    blocks: [
      { dur: 40, type: "Брифинг",    name: "Брифинг с руководством", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 1", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 2", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 3", speaker: "", notes: "" },
      { dur: 20, type: "Кофе-брейк", name: "Кофе-брейк № 1", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 4", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 5", speaker: "", notes: "" },
      { dur: 15, type: "Признание",  name: "Признание № 1", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 6", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 7", speaker: "", notes: "" },
      { dur: 25, type: "Буфер",      name: "Буфер / переход к обеду", speaker: "", notes: "" },
      { dur: 60, type: "Обед",       name: "Обед", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 8", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 9", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 10", speaker: "", notes: "" },
      { dur: 20, type: "Кофе-брейк", name: "Кофе-брейк № 2", speaker: "", notes: "" },
      { dur: 15, type: "Признание",  name: "Признание № 2", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 11", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 12", speaker: "", notes: "" },
      { dur: 15, type: "Признание",  name: "Признание № 3", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 13", speaker: "", notes: "" },
      { dur: 10, type: "Закрытие",   name: "Закрытие дня 1", speaker: "", notes: "" },
    ],
  },
  day30: {
    title: "30 мая (пятница) · 10:00–18:00",
    start: "10:00",
    blocks: [
      { dur: 20, type: "Контент",    name: "Слот 1", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 2", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 3", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 4", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 5", speaker: "", notes: "" },
      { dur: 20, type: "Кофе-брейк", name: "Кофе-брейк № 1", speaker: "", notes: "" },
      { dur: 15, type: "Признание",  name: "Признание № 4", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 6", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 7", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 8", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 9", speaker: "", notes: "" },
      { dur: 25, type: "Буфер",      name: "Буфер / переход к обеду", speaker: "", notes: "" },
      { dur: 60, type: "Обед",       name: "Обед", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 10", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 11", speaker: "", notes: "" },
      { dur: 15, type: "Признание",  name: "Признание № 5", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 12", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 13", speaker: "", notes: "" },
      { dur: 20, type: "Кофе-брейк", name: "Кофе-брейк № 2", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 14", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 15", speaker: "", notes: "" },
      { dur: 20, type: "Контент",    name: "Слот 16", speaker: "", notes: "" },
      { dur: 5,  type: "Закрытие",   name: "Закрытие мероприятия", speaker: "", notes: "" },
    ],
  },
};

// ────────────────────────────────────────────────────────────────────────
// Состояние
// ────────────────────────────────────────────────────────────────────────
const STORAGE_KEY = "event-timing-29-30-may-v1";
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// ────────────────────────────────────────────────────────────────────────
// Утилиты времени
// ────────────────────────────────────────────────────────────────────────
function timeToMin(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}
function minToTime(min) {
  min = ((min % (24 * 60)) + 24 * 60) % (24 * 60);
  const h = Math.floor(min / 60);
  const m = min % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}

// ────────────────────────────────────────────────────────────────────────
// Рендер
// ────────────────────────────────────────────────────────────────────────
function render() {
  renderDay("day-29", "day29", state.day29);
  renderDay("day-30", "day30", state.day30);
  saveState();
}

function renderDay(containerId, key, day) {
  const container = document.getElementById(containerId);
  const startMin = timeToMin(day.start);
  let cursor = startMin;
  let totalDur = 0;

  // Шапка
  let html = `
    <div class="px-4 py-3 border-b flex items-start justify-between gap-3">
      <div class="flex-1 min-w-0">
        <input class="row-input text-lg font-bold w-full"
               value="${escapeAttr(day.title)}"
               onchange="updateField('${key}', 'title', this.value)" />
        <div class="text-xs text-slate-500 mt-1 flex items-center gap-1">
          Старт:
          <input type="text" inputmode="numeric" pattern="[0-9:]*"
                 class="row-input col-time mono font-medium"
                 value="${escapeAttr(day.start)}"
                 onchange="updateStart('${key}', this.value)" />
        </div>
      </div>
      <div class="text-right">
        <div class="text-xs text-slate-500">блоков</div>
        <div class="text-lg font-bold">${day.blocks.length}</div>
      </div>
    </div>
    <ul class="divide-y" id="${key}-list">
  `;

  day.blocks.forEach((b, i) => {
    const t = TYPES[b.type] || TYPES["Контент"];
    const start = minToTime(cursor);
    const end = minToTime(cursor + b.dur);
    cursor += b.dur;
    totalDur += b.dur;

    html += `
      <li class="row ${t.bg} ${t.border} border-l-4 px-2 py-1.5 flex items-center gap-1 hover:bg-opacity-70 group"
          data-day="${key}" data-idx="${i}">
        <span class="drag-handle text-slate-400 group-hover:text-slate-700 px-1 select-none" title="перетащить">≡</span>
        <span class="col-num">${i + 1}</span>
        <span class="col-time text-xs font-medium ${t.text} font-mono">${start}</span>
        <span class="text-slate-300">→</span>
        <span class="col-time text-xs ${t.text} font-mono">${end}</span>
        <input type="number" min="1" max="600" step="5"
               class="row-input col-dur font-mono text-xs ${t.text}"
               value="${b.dur}"
               onchange="updateBlock('${key}', ${i}, 'dur', parseInt(this.value)||1)"
               title="длительность, мин" />
        <select class="row-input ${t.chip} text-xs font-medium rounded px-2 py-0.5 cursor-pointer"
                style="width: 112px;"
                onchange="updateBlock('${key}', ${i}, 'type', this.value)">
          ${Object.keys(TYPES).map(t => `<option value="${t}" ${t === b.type ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
        <input class="row-input flex-1 min-w-0 text-sm font-medium ${t.text}"
               value="${escapeAttr(b.name)}"
               placeholder="название"
               onchange="updateBlock('${key}', ${i}, 'name', this.value)" />
        <input class="row-input text-xs text-slate-600 hidden sm:block" style="width: 110px;"
               value="${escapeAttr(b.speaker || '')}"
               placeholder="спикер"
               onchange="updateBlock('${key}', ${i}, 'speaker', this.value)" />
        <button onclick="insertAfter('${key}', ${i})"
                title="вставить блок после"
                class="opacity-0 group-hover:opacity-100 transition-opacity text-emerald-700 hover:bg-emerald-200 rounded px-1 text-base font-bold">
          ＋
        </button>
        <button onclick="removeBlock('${key}', ${i})"
                title="удалить блок"
                class="opacity-0 group-hover:opacity-100 transition-opacity text-red-600 hover:bg-red-200 rounded px-1 text-base">
          ×
        </button>
      </li>
    `;
  });

  html += `</ul>`;

  // Футер дня
  const overflow = (startMin + totalDur) > 18 * 60;
  const fitClass = overflow ? "text-rose-700 font-bold" : "text-emerald-700 font-medium";
  const endTime = minToTime(startMin + totalDur);

  html += `
    <div class="px-4 py-3 border-t flex items-center justify-between text-sm bg-slate-50">
      <button onclick="insertAfter('${key}', ${day.blocks.length - 1})"
              class="px-3 py-1.5 rounded-lg bg-emerald-100 hover:bg-emerald-200 text-emerald-900 font-medium">
        ＋ Добавить блок в конец
      </button>
      <div class="text-right">
        <div class="text-xs text-slate-500">Итого ${totalDur} мин · финал ${endTime}</div>
        <div class="${fitClass} text-xs mt-0.5">
          ${overflow ? "🔴 выходит за 18:00" : "✅ помещается до 18:00"}
        </div>
      </div>
    </div>
  `;

  container.innerHTML = html;

  // Включаем drag-n-drop
  Sortable.create(document.getElementById(`${key}-list`), {
    handle: ".drag-handle",
    animation: 160,
    ghostClass: "ghost",
    onEnd(evt) {
      const blocks = state[key].blocks;
      const [moved] = blocks.splice(evt.oldIndex, 1);
      blocks.splice(evt.newIndex, 0, moved);
      render();
    },
  });
}

// ────────────────────────────────────────────────────────────────────────
// Действия
// ────────────────────────────────────────────────────────────────────────
function updateBlock(dayKey, idx, field, value) {
  state[dayKey].blocks[idx][field] = value;
  render();
}
function updateField(dayKey, field, value) {
  state[dayKey][field] = value;
  render();
}
function updateStart(dayKey, value) {
  // нормализуем "10:00"
  const v = value.trim().replace(/[^0-9:]/g, "");
  state[dayKey].start = v.includes(":") ? v : (v + ":00");
  render();
}
function insertAfter(dayKey, idx) {
  state[dayKey].blocks.splice(idx + 1, 0, {
    dur: 20, type: "Контент", name: "Новый слот", speaker: "", notes: "",
  });
  render();
  toast("Блок добавлен");
}
function removeBlock(dayKey, idx) {
  const b = state[dayKey].blocks[idx];
  if (!confirm(`Удалить «${b.name}» (${b.dur} мин)?`)) return;
  state[dayKey].blocks.splice(idx, 1);
  render();
  toast("Блок удалён");
}
function resetToDefault() {
  if (!confirm("Вернуть исходный тайминг? Все изменения будут потеряны.")) return;
  state = JSON.parse(JSON.stringify(DEFAULT_DATA));
  render();
  toast("Сброшено к исходному");
}

// ────────────────────────────────────────────────────────────────────────
// Экспорт
// ────────────────────────────────────────────────────────────────────────
function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `event-timing-29-30-may.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importJSON(evt) {
  const f = evt.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data.day29 || !data.day30) throw new Error("invalid");
      state = data;
      render();
      toast("Загружено");
    } catch (e) {
      alert("Не удалось загрузить JSON: " + e.message);
    }
  };
  r.readAsText(f);
  evt.target.value = "";
}

function copyMarkdown() {
  const md = renderMarkdown();
  navigator.clipboard.writeText(md).then(() => toast("Markdown в буфере"));
}

function renderMarkdown() {
  let out = "";
  for (const key of ["day29", "day30"]) {
    const day = state[key];
    out += `## ${day.title}\n\n`;
    out += `| № | Старт | Конец | Длит. | Тип | Название | Спикер |\n`;
    out += `|---|---|---|---|---|---|---|\n`;
    let cur = timeToMin(day.start);
    day.blocks.forEach((b, i) => {
      const s = minToTime(cur);
      const e = minToTime(cur + b.dur);
      cur += b.dur;
      out += `| ${i+1} | ${s} | ${e} | ${b.dur} мин | ${b.type} | ${b.name} | ${b.speaker || ''} |\n`;
    });
    out += "\n";
  }
  return out;
}

// ────────────────────────────────────────────────────────────────────────
// Утилиты
// ────────────────────────────────────────────────────────────────────────
function escapeAttr(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { t.style.opacity = "0"; }, 1500);
}

// keyboard: Ctrl+S — экспорт
window.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    exportJSON();
  }
});

render();
</script>
</body>
</html>
