<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Тайминг 29–30 мая · просмотр</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .col-time { width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  .col-dur  { width: 64px; text-align: center; }
  .col-num  { width: 32px; text-align: center; color: #94a3b8; font-size: 0.75rem; }
  .row-fixed {
    border-left-width: 8px !important;
    border-left-color: #dc2626 !important;
    background-image: linear-gradient(90deg, rgba(220, 38, 38, 0.06), transparent 200px);
  }
  .time-fixed {
    background: #fee2e2;
    color: #991b1b !important;
    border-radius: 4px;
    padding: 1px 6px;
    font-weight: 700;
    box-shadow: inset 0 0 0 1px #dc2626;
  }
  .fixed-badge {
    background: #dc2626; color: #fff; font-size: 0.6rem; font-weight: 700;
    letter-spacing: 0.04em; padding: 2px 6px; border-radius: 4px; text-transform: uppercase;
  }
  .conflict { box-shadow: inset 0 0 0 2px #dc2626; }
  .gap-bar  { font-size: 0.7rem; color: #6b7280; padding: 2px 8px; background: #f1f5f9; border-left: 4px dashed #cbd5e1; }
  .view-banner {
    background: linear-gradient(90deg, #dbeafe, #bfdbfe);
    border-bottom: 1px solid #60a5fa;
    padding: 6px 16px; font-size: 0.8rem; color: #1e3a8a;
    text-align: center; font-weight: 500;
  }
  @media print {
    .no-print { display: none !important; }
    .row > * { background: transparent !important; }
  }
</style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900">

<div class="view-banner no-print">
  👁 Только для просмотра · автообновление каждые 30 сек ·
  <span id="last-update" class="opacity-70"></span>
</div>

<header class="bg-white border-b sticky top-0 z-10 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-2 flex-wrap">
    <div>
      <h1 class="text-xl font-bold">Тайминг 29–30 мая</h1>
      <p class="text-xs text-slate-500">Версия для зрителей · только просмотр</p>
    </div>
    <div class="flex items-center gap-2 text-sm flex-wrap no-print">
      <button onclick="refreshNow()" class="px-3 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300">🔄 Обновить</button>
      <button onclick="copyMarkdown()" class="px-3 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300">📋 Markdown</button>
      <button onclick="window.print()" class="px-3 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300">🖨 Печать</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-4 grid lg:grid-cols-2 gap-5">
  <section id="day-29" class="bg-white rounded-xl shadow border"></section>
  <section id="day-30" class="bg-white rounded-xl shadow border"></section>
</main>

<footer class="max-w-7xl mx-auto px-4 py-6 text-xs text-slate-500 no-print">
  <div>📌 — слот зафиксирован на определённое время. <span class="text-red-600 font-semibold">Конфликт</span> — контент перед фикс-слотом не помещается.</div>
</footer>

<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-lg shadow-lg opacity-0 transition-opacity pointer-events-none text-sm"></div>

<script>
const TYPES = {
  "Открытие":   { bg: "bg-violet-100",  border: "border-violet-300",  text: "text-violet-900",   chip: "bg-violet-200 text-violet-900" },
  "Брифинг":    { bg: "bg-blue-100",    border: "border-blue-300",    text: "text-blue-900",     chip: "bg-blue-200 text-blue-900" },
  "Контент":    { bg: "bg-white",       border: "border-slate-200",   text: "text-slate-900",    chip: "bg-slate-200 text-slate-700" },
  "Рефлексия":  { bg: "bg-teal-100",    border: "border-teal-300",    text: "text-teal-900",     chip: "bg-teal-200 text-teal-900" },
  "Признание":  { bg: "bg-amber-100",   border: "border-amber-300",   text: "text-amber-900",    chip: "bg-amber-200 text-amber-900" },
  "Кофе-брейк": { bg: "bg-orange-100",  border: "border-orange-300",  text: "text-orange-900",   chip: "bg-orange-200 text-orange-900" },
  "Обед":       { bg: "bg-rose-100",    border: "border-rose-300",    text: "text-rose-900",     chip: "bg-rose-200 text-rose-900" },
  "Буфер":      { bg: "bg-slate-100",   border: "border-slate-300",   text: "text-slate-600",    chip: "bg-slate-300 text-slate-700" },
  "Закрытие":   { bg: "bg-emerald-100", border: "border-emerald-300", text: "text-emerald-900",  chip: "bg-emerald-200 text-emerald-900" },
};

const BLOB_ID = "019e5db4-e95d-77ff-8629-e0b03184fe65";
const BLOB_URL = `https://jsonblob.com/api/jsonBlob/${BLOB_ID}`;

let state = null;

function timeToMin(t) { const [h, m] = t.split(":").map(Number); return h * 60 + m; }
function minToTime(min) {
  min = Math.max(0, Math.round(min));
  const h = Math.floor(min / 60), m = min % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}
function escapeAttr(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

function computeTimings(day) {
  const startMin = timeToMin(day.start);
  let cursor = startMin;
  const out = [];
  for (const b of day.blocks) {
    let actualStart, gap = 0, conflict = false;
    if (b.fixedStart) {
      const fixed = timeToMin(b.fixedStart);
      if (cursor > fixed) { conflict = true; actualStart = cursor; }
      else if (cursor < fixed) { gap = fixed - cursor; actualStart = fixed; }
      else { actualStart = fixed; }
    } else {
      actualStart = cursor;
    }
    out.push({ start: actualStart, end: actualStart + b.dur, gap, conflict });
    cursor = actualStart + b.dur;
  }
  return out;
}

function render() {
  if (!state) return;
  renderDay("day-29", state.day29);
  renderDay("day-30", state.day30);
}

function renderDay(containerId, day) {
  const container = document.getElementById(containerId);
  const timings = computeTimings(day);

  let html = `
    <div class="px-4 py-3 border-b flex items-start justify-between gap-3">
      <div class="flex-1 min-w-0">
        <div class="text-lg font-bold">${escapeAttr(day.title)}</div>
        <div class="text-xs text-slate-500 mt-1">Старт: <span class="font-mono font-medium">${escapeAttr(day.start)}</span></div>
      </div>
      <div class="text-right">
        <div class="text-xs text-slate-500">блоков · закреплено</div>
        <div class="text-lg font-bold">${day.blocks.length} · <span class="text-red-600">${day.blocks.filter(b => b.fixedStart).length} 📌</span></div>
      </div>
    </div>
    <ul class="divide-y">
  `;

  day.blocks.forEach((b, i) => {
    const t = TYPES[b.type] || TYPES["Контент"];
    const tm = timings[i];
    const isFixed = !!b.fixedStart;
    const conflictClass = tm.conflict ? "conflict" : "";
    const rowFixedClass = isFixed ? "row-fixed" : "";
    const startTimeClass = isFixed
      ? "col-time text-xs font-mono time-fixed"
      : `col-time text-xs font-medium ${t.text} font-mono ${tm.conflict ? 'text-red-700 font-bold' : ''}`;

    if (tm.gap > 0) {
      html += `<li class="gap-bar">↓ Пустое время ${tm.gap} мин</li>`;
    }

    html += `
      <li class="row ${t.bg} ${t.border} ${conflictClass} ${rowFixedClass} border-l-4 px-2 py-1.5 flex items-center gap-2">
        <span class="col-num">${i + 1}</span>
        <span class="${startTimeClass}">${minToTime(tm.start)}</span>
        <span class="text-slate-300">→</span>
        <span class="col-time text-xs ${t.text} font-mono">${minToTime(tm.end)}</span>
        ${isFixed ? `<span class="fixed-badge" title="Зафиксировано на ${b.fixedStart}">ЗАФИКС</span>` : ''}
        <span class="col-dur font-mono text-xs ${t.text}">${b.dur}м</span>
        <span class="${t.chip} text-xs font-medium rounded px-2 py-0.5" style="min-width: 80px; text-align: center;">${b.type}</span>
        <span class="flex-1 min-w-0 text-sm font-medium ${t.text} truncate">${escapeAttr(b.name || '—')}</span>
        <span class="text-xs text-slate-600 hidden sm:block" style="width: 130px; text-align: right;">${escapeAttr(b.speaker || '')}</span>
      </li>
    `;
  });

  html += `</ul>`;

  const lastTm = timings[timings.length - 1];
  const endMin = lastTm ? lastTm.end : timeToMin(day.start);
  const totalDur = day.blocks.reduce((s, b) => s + b.dur, 0);
  const hasConflict = timings.some(t => t.conflict);
  const overflow = endMin > 18 * 60;
  let statusClass, statusText;
  if (hasConflict) { statusClass = "text-rose-700 font-bold"; statusText = "🔴 конфликт"; }
  else if (overflow) { statusClass = "text-rose-700 font-bold"; statusText = "🔴 выходит за 18:00"; }
  else { statusClass = "text-emerald-700 font-medium"; statusText = "✅ помещается до 18:00"; }

  html += `
    <div class="px-4 py-3 border-t flex items-center justify-end text-sm bg-slate-50">
      <div class="text-right">
        <div class="text-xs text-slate-500">Итого ${totalDur} мин · финал ${minToTime(endMin)}</div>
        <div class="${statusClass} text-xs mt-0.5">${statusText}</div>
      </div>
    </div>
  `;
  container.innerHTML = html;
}

function copyMarkdown() {
  if (!state) return;
  let out = "";
  for (const key of ["day29", "day30"]) {
    const day = state[key];
    const timings = computeTimings(day);
    out += `## ${day.title}\n\n`;
    out += `| № | Старт | Конец | Длит. | Тип | Название | Спикер |\n`;
    out += `|---|---|---|---|---|---|---|\n`;
    day.blocks.forEach((b, i) => {
      const pin = b.fixedStart ? " 📌" : "";
      out += `| ${i+1} | ${minToTime(timings[i].start)}${pin} | ${minToTime(timings[i].end)} | ${b.dur} мин | ${b.type} | ${b.name || '—'} | ${b.speaker || ''} |\n`;
    });
    out += "\n";
  }
  navigator.clipboard.writeText(out).then(() => toast("Markdown в буфере"));
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { t.style.opacity = "0"; }, 1500);
}

async function fetchState(showToast = false) {
  try {
    const res = await fetch(BLOB_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data || !data.day29 || !data.day30) throw new Error("invalid data");
    state = data;
    render();
    const t = new Date().toLocaleTimeString("ru-RU").slice(0, 5);
    document.getElementById("last-update").textContent = `обновлено в ${t}`;
    if (showToast) toast("Обновлено");
  } catch (e) {
    document.getElementById("last-update").textContent = "🔴 ошибка загрузки: " + e.message;
  }
}

function refreshNow() { fetchState(true); }

fetchState();
setInterval(fetchState, 30000);
</script>
</body>
</html>
